[package]
name = "jxl-encoder-gpu"
version = "0.0.1"
description = "Multi-vendor GPU kernels for jxl-encoder via CubeCL (CUDA/WGPU/HIP)"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

[features]
default = ["cuda", "encoder"]
cuda = ["cubecl/cuda"]
wgpu = ["cubecl/wgpu"]
hip = ["cubecl/hip"]
cpu = ["cubecl/cpu"]
# `encoder` brings in the jxl-encoder dep for the high-level GpuEncoder
# facade. Disable for kernel-library-only builds (smaller dep tree).
encoder = ["dep:jxl-encoder"]
# `butteraugli-loop` enables the GPU butteraugli orchestrator
# (`forks::butteraugli_loop_gpu`) that mirrors upstream's
# `vardct::butteraugli_loop` but runs the per-iteration distance
# compute on GPU via zenmetrics/butteraugli-gpu. Off by default.
butteraugli-loop = ["dep:butteraugli-gpu"]
# `corpus` enables integration tests that read images from a known
# corpus path (codec-corpus on the dev machine) and assert
# butteraugli scores within tolerance against committed expectations.
# Required to RUN the corpus regression suite — build/CI default
# leaves it off so CI doesn't need the corpus tree.
corpus = ["cuda", "encoder", "butteraugli-loop"]

[dependencies]
cubecl = { workspace = true }
# `__pre_quantized` exposes EncoderPrecomputed::from_parts +
# encode_from_precomputed for the GPU bitstream-emit path
# (see encode_lossy_to_bitstream_via_precomputed in encoder.rs).
jxl-encoder = { workspace = true, optional = true, features = ["std", "__pre_quantized", "parallel"] }
# Used directly (rayon::join × 3) for the post-download repack +
# downstream batched ops in encode_lossy_to_bitstream_via_precomputed*.
rayon = "1.10"
butteraugli-gpu = { workspace = true, optional = true }

[dev-dependencies]
jxl-encoder-simd = { workspace = true }
# `__internals` exposes pub(crate) symbols (epf_step0_strip,
# adjust_quant_block_ac, compute_scaled_constants, ytox_ratio,
# ytob_ratio, INV_DC_QUANT) for G5.1-compliant parity testing.
jxl-encoder = { workspace = true, features = ["std", "__internals", "parallel"] }
bytemuck = { workspace = true }
image = { workspace = true }
jxl = { workspace = true }
fast-ssim2 = { workspace = true }
imgref = { workspace = true }
# CPU butteraugli — for buttloop_parity diagnostic comparing GPU vs CPU
# per-tile distance maps. Per-image dev-dep, not part of the runtime.
butteraugli = { workspace = true }
rgb = { workspace = true }
# Raw CUDA driver bindings — used only by examples/perf_raw_cuda_upload.rs
# to benchmark cuMemcpyHtoD directly, bypassing cubecl. Matches the
# version cubecl-cuda already pulls in transitively (0.19.x), so no
# extra resolver pain. Features kept minimal: just driver + std.
# cuda-version-from-build-system + fallback-* match cubecl-cuda's
# feature set to ensure unified linkage.
cudarc = { version = "0.19.4", default-features = false, features = [
    "std",
    "driver",
    "cuda-version-from-build-system",
    "fallback-dynamic-loading",
    "fallback-latest",
] }
