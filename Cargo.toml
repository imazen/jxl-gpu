[workspace]
members = ["jxl-encoder-gpu"]
resolver = "2"

[workspace.package]
authors = ["Imazen <support@imazen.io>"]
homepage = "https://github.com/imazen/jxl-encoder-gpu"
repository = "https://github.com/imazen/jxl-encoder-gpu"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
jxl-encoder-gpu = { version = "0.0.1", path = "jxl-encoder-gpu", default-features = false }

# CubeCL — single source of truth for the GPU backend version.
# Pinned to match zenmetrics; bump together when upgrading.
cubecl = { version = "0.10.0-pre.4", default-features = false, features = ["std"] }

# CPU reference parity — the SIMD/scalar primitives we are porting.
# Pulled from local jxl-encoder workspace (path dep, host-specific) for
# now; switch to a published version once jxl-encoder-simd publishes the
# `_scalar` variants on a stable release.
jxl-encoder-simd = { path = "../jxl-encoder/jxl-encoder-simd", default-features = true }

# Runtime dep on jxl-encoder for the sequential parts (ANS entropy
# coding, bitstream writer, container muxing, frame headers). Optional
# — gated by the `encoder` feature in the jxl-encoder-gpu crate.
jxl-encoder = { path = "../jxl-encoder/jxl-encoder", default-features = false }

bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# jxl-rs — primary Rust JXL decoder for roundtrip tests.
jxl = { path = "/home/lilith/work/third-party/jxl-rs/jxl" }

[profile.dev]
# Compile at opt-level=3 even in debug builds — GPU kernels and
# DCT inner loops are too slow at -O0 to be useful during iteration.
opt-level = 3

# Dependencies (cubecl, image, jxl, etc.) also at -O3 — they run on
# every benchmark/example invocation, and -O1 leaves real
# throughput on the floor. Initial clean build is slower as a
# result; incremental rebuilds of our crate are unaffected.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = "full"
split-debuginfo = "packed"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "fat"
debug = false
codegen-units = 1
