name: Clone sibling path-dep repos
description: >
  Clone the imazen + lilith sibling repos that the workspace Cargo.toml
  references via local paths. Cargo refuses to even parse the workspace
  manifest unless every path-dep manifest can be loaded — true even for
  --lib builds and `cargo fmt --check`. Runs on Linux, macOS, and Windows
  via bash (Git Bash on Windows). Also writes a Cross.toml override so
  builds invoked through `cross` mount the sibling layout into the
  container.

runs:
  using: composite
  steps:
    - name: Clone siblings (host)
      shell: bash
      run: |
        set -euxo pipefail
        # Layout (relative to GITHUB_WORKSPACE):
        #   ../jxl-encoder        -> imazen/jxl-encoder    (provides
        #                                                    jxl-encoder
        #                                                    + jxl-encoder-simd)
        #   ../zenmetrics         -> imazen/zenmetrics (default branch;
        #                            butteraugli-gpu `internals`)
        #   ../zensim             -> imazen/zensim
        #   ../fast-ssim2         -> imazen/fast-ssim2
        #   ../../butteraugli     -> imazen/butteraugli
        #   ../../third-party/jxl-rs -> lilith/jxl-rs @ develop
        parent="$(dirname "$GITHUB_WORKSPACE")"
        gparent="$(dirname "$parent")"
        clone_if_missing() {
          local url="$1" dst="$2" branch="${3:-}"
          if [ -d "$dst/.git" ]; then
            echo "Already present: $dst"
            return 0
          fi
          if [ -n "$branch" ]; then
            git clone --depth 1 --branch "$branch" "$url" "$dst"
          else
            git clone --depth 1 "$url" "$dst"
          fi
        }
        clone_if_missing https://github.com/imazen/jxl-encoder "$parent/jxl-encoder"
        clone_if_missing https://github.com/imazen/zenmetrics "$parent/zenmetrics"
        clone_if_missing https://github.com/imazen/zensim "$parent/zensim"
        clone_if_missing https://github.com/imazen/fast-ssim2 "$parent/fast-ssim2"
        clone_if_missing https://github.com/imazen/butteraugli "$gparent/butteraugli"

        # workspace.dependencies.jxl points at ../../third-party/jxl-rs/jxl.
        mkdir -p "$gparent/third-party"
        clone_if_missing https://github.com/lilith/jxl-rs "$gparent/third-party/jxl-rs" develop

    - name: Write Cross.toml override (i686 / cross-rs builds only)
      shell: bash
      run: |
        set -euxo pipefail
        # cross-rs runs the build inside a Docker container with the
        # workspace mounted at $CARGO_TARGET_DIR's parent (typically
        # /project). The host sibling clones live at $GITHUB_WORKSPACE/..
        # and don't survive the container boundary unless we mount them.
        # Cross.toml `pre-build` runs once per image build and does the
        # in-container clones; this is simpler than wiring volumes for
        # an absolute path the workspace can already resolve.
        ws="$GITHUB_WORKSPACE"
        # Only write Cross.toml if it doesn't exist; never clobber a
        # repo-checked-in one.
        if [ -f "$ws/Cross.toml" ]; then
          echo "Cross.toml already exists; leaving alone"
          exit 0
        fi
        cat > "$ws/Cross.toml" <<'TOML'
        # Generated by .github/actions/clone-siblings during CI.
        # Not committed — recreated each run.
        [build]
        pre-build = [
            "apt-get update && apt-get install -y --no-install-recommends git ca-certificates",
            "git clone --depth 1 https://github.com/imazen/jxl-encoder /jxl-encoder",
            "git clone --depth 1 https://github.com/imazen/zenmetrics /zenmetrics",
            "git clone --depth 1 https://github.com/imazen/zensim /zensim",
            "git clone --depth 1 https://github.com/imazen/fast-ssim2 /fast-ssim2",
            "git clone --depth 1 https://github.com/imazen/butteraugli /butteraugli",
            "mkdir -p /third-party && git clone --depth 1 --branch develop https://github.com/lilith/jxl-rs /third-party/jxl-rs",
        ]
        TOML
        echo "Wrote $ws/Cross.toml"
