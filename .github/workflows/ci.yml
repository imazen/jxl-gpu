name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # CPU-backend build on every platform (no CUDA on shared runners).
  # Verifies the crate compiles + runs tests with cubecl-cpu fallback.
  build-cpu:
    name: build (cpu) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo build --no-default-features --features cpu --lib
        run: cargo build --release --no-default-features --features cpu --lib
      - name: cargo test --no-default-features --features cpu
        # Tests run with the CPU backend; partition_selector test has no
        # GPU dependency so it always runs.
        run: cargo test --release --no-default-features --features cpu --tests

  # Cross-compile to i686-unknown-linux-gnu — catches 32-bit pointer-width
  # bugs (mandatory per global CLAUDE.md).
  build-i686:
    name: build (cpu) / i686-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked
      - name: cross build --target i686-unknown-linux-gnu
        run: cross build --release --no-default-features --features cpu --lib --target i686-unknown-linux-gnu

  # Format + clippy gate on Linux (the canonical lint host).
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (lib + tests only — examples are throwaway parity probes)
        run: cargo clippy --release --no-default-features --features cpu --lib --tests -- -D warnings

  # WGPU backend on shared GitHub runners — exercises the GPU kernels
  # via Mesa's Lavapipe (software Vulkan ICD). Slow (~minutes per
  # parity example) but actually executes #[cube] kernel code, unlike
  # the cubecl-cpu fallback. Catches regressions in the kernels
  # themselves on a vendor-agnostic backend.
  build-wgpu:
    name: build + parity (wgpu / Lavapipe)
    runs-on: ubuntu-latest
    env:
      # Force wgpu to pick the Vulkan backend (Lavapipe = SW Vulkan).
      WGPU_BACKEND: vulkan
      # Force any GLX-bound code path through Mesa softpipe (defense in
      # depth — wgpu shouldn't touch GLX, but cubecl-wgpu init has
      # surprised us before).
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Suppress wgpu's chatty info-level logs in CI.
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Clone sibling path-dep repos (jxl-encoder / zenmetrics / fast-ssim2 / butteraugli / jxl-rs)
        # The workspace `Cargo.toml` carries path deps to sibling repos that
        # only exist in the maintainer's local layout (`~/work/zen/...`).
        # Cargo refuses to even parse the workspace manifest unless every
        # path-dep manifest can be loaded — this is true for `--lib` builds
        # too, even though those deps would not actually be compiled. Clone
        # the public siblings into the layout the workspace expects.
        # `lilith/jxl-rs` is referenced by an absolute path
        # (`/home/lilith/work/third-party/jxl-rs/jxl`) — recreate that path
        # under HOME so the runner doesn't need root.
        run: |
          set -euxo pipefail
          # Layout (relative to GITHUB_WORKSPACE = /home/runner/work/jxl-gpu/jxl-gpu):
          #   ../jxl-encoder        -> imazen/jxl-encoder
          #   ../zenmetrics         -> imazen/zenmetrics
          #   ../fast-ssim2         -> imazen/fast-ssim2
          #   ../../butteraugli     -> imazen/butteraugli
          # Plus an absolute /home/lilith/work/third-party/jxl-rs symlinked
          # via a writable home dir.
          parent="$(dirname "$GITHUB_WORKSPACE")"
          gparent="$(dirname "$parent")"
          git clone --depth 1 https://github.com/imazen/jxl-encoder "$parent/jxl-encoder"
          # zenmetrics: workspace expects the `internals` feature on
          # butteraugli-gpu (see comment in workspace Cargo.toml:42-45)
          # which only exists on `feat/internals-from-linear-planes`.
          git clone --depth 1 --branch feat/internals-from-linear-planes \
            https://github.com/imazen/zenmetrics "$parent/zenmetrics"
          git clone --depth 1 https://github.com/imazen/fast-ssim2 "$parent/fast-ssim2"
          git clone --depth 1 https://github.com/imazen/butteraugli "$gparent/butteraugli"
          # The absolute path /home/lilith/work/third-party/jxl-rs/jxl
          # lives in workspace.dependencies for the `jxl` crate. Symlink it
          # into existence on the CI runner. `lilith/jxl-rs` default branch
          # is `develop`, not `main`.
          sudo mkdir -p /home/lilith/work/third-party
          sudo chown -R "$(id -u):$(id -g)" /home/lilith
          git clone --depth 1 --branch develop https://github.com/lilith/jxl-rs /home/lilith/work/third-party/jxl-rs
      - name: Install Lavapipe + Vulkan tools (Mesa SW Vulkan ICD)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Discover Lavapipe ICD path and export VK_ICD_FILENAMES
        # Mesa renamed the ICD JSON across versions: older Ubuntu installed
        # `lvp_icd.x86_64.json`, Ubuntu 24.04's `mesa-vulkan-drivers`
        # (Mesa 25.x+) ships the unsuffixed `lvp_icd.json`. Match either
        # and export to GITHUB_ENV so subsequent steps inherit the path.
        run: |
          set -euo pipefail
          for cand in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                      /usr/share/vulkan/icd.d/lvp_icd.json; do
            if [ -f "$cand" ]; then
              echo "Found Lavapipe ICD at $cand"
              echo "VK_ICD_FILENAMES=$cand" >> "$GITHUB_ENV"
              found=1
              break
            fi
          done
          if [ -z "${found:-}" ]; then
            echo "No Lavapipe ICD found in /usr/share/vulkan/icd.d/" >&2
            ls -la /usr/share/vulkan/icd.d/ >&2
            exit 1
          fi
      - name: Verify Lavapipe is reachable via Vulkan loader
        run: |
          echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
          vulkaninfo --summary | head -40
          # Sanity: ensure the loader actually surfaces a llvmpipe device.
          # Without this, wgpu would silently fall back to no-adapter and
          # the parity examples would either hang or hit a "no device" panic.
          vulkaninfo --summary | grep -q 'DRIVER_ID_MESA_LLVMPIPE' || {
            echo "Lavapipe driver not surfaced — VK loader can't see it" >&2
            exit 1
          }
      - name: cargo build --no-default-features --features wgpu --lib
        run: cargo build --release --no-default-features --features wgpu --lib
      - name: cargo build parity examples (wgpu)
        run: |
          cargo build --release --no-default-features --features wgpu \
            --example xyb_parity --example dct8_parity
      - name: Run xyb_parity (pointwise XYB forward+inverse kernel)
        # ~256 KB upload, two pointwise kernels, two downloads. Fastest
        # parity check — verifies the wgpu compute pipeline end-to-end
        # (compile cube source → upload → dispatch → download) without
        # spending too long.
        run: ./target/release/examples/xyb_parity
      - name: Run dct8_parity (per-block compute with SharedMemory)
        # Heavier kernel: forward DCT8 + IDCT8 over 256 blocks, exercises
        # SharedMemory + cube_dim + DCT/IDCT roundtrip. Catches a much
        # larger swath of #[cube] surface than xyb alone.
        run: ./target/release/examples/dct8_parity

  # CUDA build on a self-hosted runner with NVIDIA hardware.
  # Disabled by default — uncomment + add a self-hosted runner with
  # CUDA 13+ to enable. The full parity examples only run here.
  # build-cuda:
  #   name: build + parity (cuda) / self-hosted
  #   runs-on: [self-hosted, linux, x64, gpu]
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: dtolnay/rust-toolchain@stable
  #     - uses: Swatinem/rust-cache@v2
