  #       run: cargo build --release --features cuda --examples
  #     - name: parity smoke test
  #       run: |
  #         for ex in xyb_parity phase1_parity dct8_parity \
  #                   phase2_small_parity pixel_loss_parity dequant_parity \
  #                   dct16_parity dct16_rect_parity dct4_parity \
  #                   dct32_parity dct64_parity quantize_cfl_parity \
  #                   epf_parity entropy_parity per_block_modulations_parity \
  #                   pre_erosion_parity cost_grid_demo; do
  #           echo "=== $ex ==="
  #           ./target/release/examples/$ex
